version: "3.12"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file: .env  # Load environment variables from .env
    volumes:
      - ./app:/app
      - output:/app/output # Mount the persistent volume
    command: "gunicorn --bind 0.0.0.0:5000  app:app"

  worker:
    build: .
    depends_on:
      - web
    env_file: .env # Load environment variables from .env
    volumes:
      - ./app:/app
    command: bash -c "source /app/.venv/bin/activate && celery -A app.celery worker --loglevel=info"

volumes:
  output:
